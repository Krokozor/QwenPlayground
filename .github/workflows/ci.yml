name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  tags:
    - 'v*'

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build QwenPlayground.slnx -c Release
      - name: Test
        run: dotnet test QwenPlayground.slnx -c Release --no-build

  # Релиз-артефакт (zip с исходниками) — только по тегу v*, чтобы не спамить
  # релизами при быстрой итеративной разработке.
  release:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package sources
        shell: pwsh
        run: |
          $exclude = @('.git', 'run', 'sessions', 'memories', 'tmp', 'external', 'launcher', 'logs', 'screenshots', 'bin', 'obj')
          $items = Get-ChildItem -Force | Where-Object { $exclude -notcontains $_.Name }
          Compress-Archive -Path $items.FullName -DestinationPath "QwenPlayground-${{ github.ref_name }}.zip"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: QwenPlayground-*.zip
